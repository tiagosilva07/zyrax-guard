name: Bug report
description: Something is broken or behaving unexpectedly
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you run, and what went wrong?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Exact command
      placeholder: zyrax-guard scan-agents .
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: zyrax-guard version
      description: Output of `zyrax-guard --version`
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: Install method
      options:
        - npm / npx
        - Homebrew
        - Scoop
        - go install
        - curl install script
        - Signed release binary
        - GitHub Action
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output / logs
      description: Paste output here. Redact secrets, tokens, or private file contents.
      render: shell
