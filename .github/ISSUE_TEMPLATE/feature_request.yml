name: Feature request
description: Suggest an improvement or new capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - scan-agents (AI agent/MCP config auditing)
        - check / scan / install (package vetting)
        - MCP server
        - GitHub Action
        - Self-update / packaging
        - Other
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Note: zyrax-guard's free CLI is intentionally **local, deterministic, and zero-dependency**.
        Features that require a network call to a third-party LLM or send file contents off-machine
        are unlikely to be accepted into the free CLI — see [positioning](https://zyrax.io).
