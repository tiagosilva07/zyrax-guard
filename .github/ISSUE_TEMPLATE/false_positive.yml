name: False positive / false negative
description: A finding is wrong (flagged something safe, or missed something malicious)
labels: ["false-positive", "detection"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - False positive (flagged something safe)
        - False negative (missed something it should have caught)
    validations:
      required: true
  - type: dropdown
    id: command
    attributes:
      label: Command
      options:
        - scan-agents
        - check / scan
        - install
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest package name, or config snippet, that reproduces this. Redact anything private — use synthetic values if the real file is sensitive.
      render: shell
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What zyrax-guard reported
      render: shell
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why this is wrong
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: zyrax-guard version
    validations:
      required: true
